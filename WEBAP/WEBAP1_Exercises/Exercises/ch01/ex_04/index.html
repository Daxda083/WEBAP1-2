<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.4</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
            $(document).ready(function () {
            $("#calc").click(function () {
                let number1 = $("#a").val();
                let number2 = $("#b").val();
                let operator = $("#op").val();
                let result = 0;




                if (number1 !== "" && number2 !== "") {
                    number1 = parseFloat(number1);
                    number2 = parseFloat(number2);

                    if (!isNaN(number1) && !isNaN(number2)) {
                        if (number2 === 0 && operator === "/") {
                            $("#result").text("Please don't divide by 0!")
                        } else {
                            switch (operator) {
                                case "+": result = number1 + number2;
                                    break;
                                case "-": result = number1 - number2;
                                    break;
                                case "*": result = number1 * number2;
                                    break;
                                case "/": result = number1 / number2;
                                    break;
                            }
                            $("#result").text(result);
                        }
                    } else {
                        $("#result").text("Please enter valid numbers!");
                    }
                } else {
                    $("#result").text("Please fill out both fields!");
                }
            });
            // TODO: #calc: read #a, #b and #op, convert the values to numbers and display the result in #result

            // TODO: error messages for invalid input and division by zero
        });
    </script>
</head>
<body>
    <h2>Exercise 1.4 – Calculator</h2>
    <p>
        <input type="number" id="a" placeholder="Number 1">
        <select id="op">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>
        <input type="number" id="b" placeholder="Number 2">
        <button id="calc">=</button>
        <span id="result" class="result"></span>
    </p>
</body>
</html>
