<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercise 1.5</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {

    // 1. Show summary when the button is clicked
    $("#summary").on("click", function () {

        // Empty the list first
        $("#output").empty();

        // Get values from the form
        let name = $("#name").val();
        let email = $("#email").val();
        let schoolClass = $("#class").val();
        let language = $("input[name='language']:checked").val();
        let newsletter = $("#newsletter").prop("checked");
        let remarks = $("#remarks").val();

        // Add each value to the output list
        $("#output").append("<li>Name: " + name + "</li>");
        $("#output").append("<li>E-mail: " + email + "</li>");
        $("#output").append("<li>Class: " + schoolClass + "</li>");
        $("#output").append("<li>Language: " + language + "</li>");
        $("#output").append("<li>Newsletter: " + (newsletter ? "yes" : "no") + "</li>");
        $("#output").append("<li>Remarks: " + remarks + "</li>");

    });


    // 2. Enable or disable summary button depending on name
    $("#name").on("input", function () {

        if ($(this).val().trim() !== "") {
            $("#summary").prop("disabled", false);
        } else {
            $("#summary").prop("disabled", true);
        }

    });


    // 3. Reset everything
    $("#reset").on("click", function () {

        // Clear all text fields
        $("#name").val("");
        $("#email").val("");
        $("#remarks").val("");

        // Reset class dropdown
        $("#class").val("");

        // Select English again
        $("input[name='language'][value='EN']").prop("checked", true);

        // Uncheck newsletter
        $("#newsletter").prop("checked", false);

        // Empty output list
        $("#output").empty();

        // Disable summary button
        $("#summary").prop("disabled", true);

    });

});
    </script>
</head>

<body>
    <h2>Exercise 1.5 – Registration</h2>
    <form id="registration">
        <p><label>Name: <input type="text" id="name"></label></p>
        <p><label>E-mail: <input type="email" id="email"></label></p>
        <p>
            <label>Class:
                <select id="class">
                    <option value="">– please select –</option>
                    <option value="1TPIF">1TPIF</option>
                    <option value="2TPIF">2TPIF</option>
                    <option value="3TPIF">3TPIF</option>
                </select>
            </label>
        </p>
        <p>
            Preferred language:
            <label><input type="radio" name="language" value="EN" checked> English</label>
            <label><input type="radio" name="language" value="FR"> French</label>
            <label><input type="radio" name="language" value="DE"> German</label>
        </p>
        <p><label><input type="checkbox" id="newsletter" value="yes"> I want to receive the newsletter</label></p>
        <p><label>Remarks:<br><textarea id="remarks" rows="3" cols="40"></textarea></label></p>
        <p>
            <button type="button" id="summary" disabled>Show summary</button>
            <button type="button" id="reset">Reset</button>
        </p>
    </form>
    <ul id="output"></ul>
</body>

</html>
