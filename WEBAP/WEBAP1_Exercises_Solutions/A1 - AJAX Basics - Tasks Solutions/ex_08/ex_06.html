<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2.8</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
        $(document).ready(function()
        {
            $(".letter a").click(function()
            {
                var letter = $(this).html().toLowerCase();
                $(".dictionary").load("entries.html #container-" + letter);
                return false;
            });
        });
    </script>
</head>
<body>
    <div id="container">

        <div class="header">
            <h2>Wörterbuch</h2>
        </div>

        <div class="letters">
            <div class="letter" id="letter-a">
                <h3><a href="entries.html">A</a></h3>
            </div>
            <div class="letter" id="letter-b">
                <h3><a href="entries.html">B</a></h3>
            </div>
            <div class="letter" id="letter-c">
                <h3><a href="entries.html">C</a></h3>
            </div>
            <div class="letter" id="letter-d">
                <h3><a href="entries.html">D</a></h3>
            </div>
            <div class="letter" id="letter-e">
                <h3><a href="entries.html">E</a></h3>
            </div>
            <div class="letter" id="letter-f">
                <h3><a href="entries.html">F</a></h3>
            </div>
            <div class="letter" id="letter-g">
                <h3><a href="entries.html">G</a></h3>
            </div>
            <div class="letter" id="letter-h">
                <h3><a href="entries.html">H</a></h3>
            </div>
        </div>

        <div class="dictionary"></div>

    </div>
</body>
</html>
